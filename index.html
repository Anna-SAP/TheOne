<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE ONE 爆款试听室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="上传几首歌，制作人从里面只选一首最有爆款潜质的，并给出逐条可验证的理由。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Noto+Serif+SC:wght@500;700;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="mast">
  <div class="wrap mast-row">
    <span class="wordmark">THE ONE</span>
    <span class="mast-note">爆款试听室 · 只选一首</span>
  </div>
</header>

<main>
  <section id="stage-upload" class="stage">
    <div class="wrap">
      <div class="hero">
        <h1>把歌都交上来。<br>我只选一首。</h1>
        <p class="lede">我做过 K-pop、EDM、C-pop 和国风的爆款，有绝对音感。给我一堆歌，我告诉你哪一首会红，以及为什么是它、不是另外几首。</p>
      </div>

      <div class="desk">
        <div class="desk-main">
          <label id="drop" class="drop" for="file-input">
            <input id="file-input" type="file" multiple accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.opus,.aif,.aiff">
            <span class="drop-title">把音频拖到这里，或点击选择</span>
            <span class="drop-sub">2 到 12 首，mp3 / wav / m4a / flac / ogg。音频只在你的浏览器里分析，不会上传。</span>
          </label>

          <ol id="queue" class="queue" aria-label="待听的歌"></ol>
          <p id="queue-note" class="queue-note" role="status" aria-live="polite"></p>

          <div class="actions">
            <button id="btn-start" class="btn btn-primary" type="button" disabled>开始听</button>
            <button id="btn-clear" class="btn btn-ghost" type="button" hidden>清空</button>
            <button id="btn-demo" class="btn btn-ghost" type="button">手边没有歌？用 3 首合成示例试一下</button>
          </div>
        </div>

        <aside class="criteria" aria-labelledby="criteria-title">
          <h2 id="criteria-title">我听这七件事</h2>
          <ul id="criteria-list" class="criteria-list"></ul>
        </aside>
      </div>
    </div>
  </section>

  <section id="stage-verdict" class="stage" hidden></section>
</main>

<footer class="foot">
  <div class="wrap">
    <p><strong>判断是怎么来的。</strong>每首歌在你的浏览器里解码，然后测量 K 计权响度（近似 ITU-R BS.1770）、节拍、调性和频段分布，并用自相似分析找出全曲反复出现的段落。七个维度加权后，总分最高的就是 the one。这是一套基于音频特征的经验模型：它不听歌词，不看歌手是谁，也不能保证市场结果。</p>
  </div>
</footer>

<script src="js/analysis.js"></script>
<script src="js/judge.js"></script>
<script src="js/demo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
